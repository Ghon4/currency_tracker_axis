name: currency_tracker_axis
description: Currency Exchange Tracker against EGP.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  freezed_annotation: ^3.1.0

  # Serialization
  json_annotation: ^4.12.0

  # Network / connectivity
  dio: ^5.9.0
  connectivity_plus: ^6.1.4

  # Cache
  # Note: hive_generator is incompatible with freezed ^3 (source_gen conflict).
  # TypeAdapters are hand-written in cache_models.dart.
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # UI
  fl_chart: ^0.70.2
  shimmer: ^3.0.0
  intl: ^0.20.2

  # DI / navigation
  get_it: ^8.0.3
  go_router: ^14.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  freezed: ^3.0.6
  json_serializable: ^6.9.5
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
